# Which model runs which part of the day.
#
# A tier is a job description. Each harness maps a tier to a model it knows.
# `cx models` prints the resolved table. `cx run <skill>` uses it.
# {kit} is the manual, {house} is where the private files live. Both are the repo root today.
# An empty model means "the harness default": the flag is dropped.

[tiers]
fast = "Reading, sorting, bookkeeping. Nothing a customer reads."
standard = "Judgment a person is about to look at."
frontier = "Words a customer reads, and calls that are hard to undo."
judge = "Grading another model's reply. Prefer a different family from the drafter."

[skills]
setup = "standard"
open = "fast"
floor = "frontier"
triage = "standard"
close = "standard"
friday = "frontier"
eval-draft = "frontier"
eval-judge = "judge"

# Floor only. The moment can move the tier. Anything not listed uses the floor tier.
[moments]
small-moment = "standard"
account-health-check = "standard"
feature-launch = "standard"
integration-setup = "standard"
technical-troubleshooting = "standard"

[eval]
# The judge should not grade its own family. Point this at a second harness when one is installed.
judge_harness = ""

[harness.claude]
command = ["claude", "-p", "{prompt}", "--model", "{model}", "--add-dir", "{kit}", "--add-dir", "{house}", "--allowedTools", "{allow}"]
pure = ["claude", "-p", "{prompt}", "--model", "{model}", "--output-format", "text"]
# What an unattended run may do without asking. Anything else is denied, because
# nobody is there to approve it. Reads inside the repo need no rule; reads outside
# it are denied. Writes stay in the private files. `cx run` adds mcp__<name> for
# each connector local/consent.toml allows.
allow = ["Edit(local/**)", "Edit(voice-queue.md)", "Edit(context-inbox.md)", "Bash(scripts/cx check:*)"]
fast = "haiku"
standard = "sonnet"
frontier = "opus"
judge = "sonnet"

[harness.codex]
command = ["codex", "exec", "-m", "{model}", "-C", "{house}", "--sandbox", "workspace-write", "{prompt}"]
pure = ["codex", "exec", "-m", "{model}", "--sandbox", "read-only", "{prompt}"]
fast = ""
standard = ""
frontier = ""
judge = ""

[harness.cursor]
command = ["cursor-agent", "-p", "{prompt}", "--model", "{model}", "--output-format", "text"]
pure = ["cursor-agent", "-p", "{prompt}", "--model", "{model}", "--output-format", "text"]
fast = ""
standard = ""
frontier = ""
judge = ""

[harness.gemini]
command = ["gemini", "-p", "{prompt}", "-m", "{model}", "--include-directories", "{kit},{house}"]
pure = ["gemini", "-p", "{prompt}", "-m", "{model}"]
fast = ""
standard = ""
frontier = ""
judge = ""
