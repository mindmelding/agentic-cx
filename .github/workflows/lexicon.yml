name: lexicon

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python3 scripts/test_cx.py
      - name: Gold replies and template examples
        run: scripts/cx check --gold --templates
